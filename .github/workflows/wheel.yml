name: Build Wheels and Test
on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.os }} - ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, ubuntu-22.04 ]
        arch: [ x86_64 ]
        include:
          - os: ubuntu-24.04-arm
            arch: aarch64
          - os: ubuntu-22.04-arm
            arch: aarch64
          - os: macos-latest
            arch: arm64
          - os: windows-2025
            arch: AMD64
            windows-build: cp3{9,10,11,12,13}-win_amd64
            cmake-platform: x64
          - os: windows-11-arm
            arch: ARM64
            windows-build: cp3{12,13}-win_arm64
            cmake-platform: ARM64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup native Windows ARM64 Python
        if: matrix.os == 'windows-11-arm'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: arm64

      - name: Install Dependencies macOS
        if: runner.os == 'macOS'
        run: pip3 install --break-system-packages wheel

      - name: Install Dependencies macOS
        if: runner.os != 'macOS'
        run: pip3 install -U wheel

      - name: Configure MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.cmake-platform }}

      - name: Check MSVC Release flags
        if: runner.os == 'Windows'
        run: |
          python -m pip install cmake ninja
          python -m unittest discover -s tests -p test_cmake_release.py -v

      - name: Build Wheels
        uses: pypa/cibuildwheel@v2.22.0
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_BUILD: >
            cp3{9,10,11,12,13}-macosx_${{ matrix.arch }}
            cp3{9,10,11,12,13}-manylinux_${{ matrix.arch }}
            ${{ matrix.windows-build }}
          CIBW_ENVIRONMENT_WINDOWS: >
            CMAKE_GENERATOR_PLATFORM=${{ matrix.cmake-platform }}
            CMAKE_BUILD_PARALLEL_LEVEL=2
          CIBW_BEFORE_BUILD_WINDOWS: ${{ matrix.arch == 'ARM64' && 'python -m pip install delvewheel==1.13.2' || '' }}
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: ${{ matrix.arch == 'ARM64' && 'delvewheel repair --analyze-existing -w {dest_dir} {wheel}' || '' }}
          MACOSX_DEPLOYMENT_TARGET: "11"
          CIBW_BUILD_VERBOSITY: 1


      - name: List Build Results
        run: ls wheelhouse

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          # Use a unique artifact name per job to avoid conflicts.
          name: wheels-${{ matrix.os }}-${{ matrix.arch }}
          path: ./wheelhouse/*.whl
          if-no-files-found: warn
          compression-level: 6
          overwrite: false
          include-hidden-files: false
  run:
    name: Test on ${{ matrix.os }} with Python ${{ matrix.python-version }}
    needs: [build]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, ubuntu-22.04 ]
        arch: [ x86_64 ]
        include:
          - os: ubuntu-24.04-arm
            arch: aarch64
            python-version: '3.13'
          - os: ubuntu-22.04-arm
            arch: aarch64
            python-version: '3.13'
          - os: macos-latest
            arch: arm64
            python-version: '3.13'
          - os: windows-2025
            arch: AMD64
            python-version: '3.13'
          - os: windows-11-arm
            arch: ARM64
            python-version: '3.12'
          - os: windows-11-arm
            arch: ARM64
            python-version: '3.13'
        python-version: ['3.13']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          architecture: ${{ matrix.arch == 'ARM64' && 'arm64' || '' }}

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          # Download the artifact with the matching OS and architecture.
          name: wheels-${{ matrix.os }}-${{ matrix.arch }}
          path: built_wheels

      - name: Display structure of downloaded files
        run: ls -R built_wheels

      - name: Install Dependencies
        run: python -m pip install trimesh numpy

      - name: Install Packages
        run: python -m pip install --no-index --find-links built_wheels coacd

      - name: Run Tests
        run: python run_tests.py -v
        
  release_artifacts:
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')
    name: Release repaired and tested wheels
    needs: [build, run]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      # IMPORTANT: this permission is mandatory for trusted publishing
      id-token: write
      contents: write

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Optional, use if you use setuptools_scm
        submodules: true  # Optional, use if you have submodules

    - name: Download compressed artifacts
      id: download
      uses: actions/download-artifact@v4
      with:
        path: ./artifacts
        merge-multiple: true

    - name: Display structure of downloaded files
      run: ls -R ./artifacts

    - name: Create release and upload wheels
      uses: ncipollo/release-action@v1
      with:
        allowUpdates: true
        artifacts: "${{ steps.download.outputs.download-path }}/*.whl,${{ steps.download.outputs.download-path }}/*.gz,${{ steps.download.outputs.download-path }}/*.so,${{ steps.download.outputs.download-path }}/*.dylib,${{ steps.download.outputs.download-path }}/*.lib,${{ steps.download.outputs.download-path }}/*.dll"
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: PyPI Publish
      uses: pypa/gh-action-pypi-publish@v1.12.4
      with:
        packages-dir: ${{ steps.download.outputs.download-path }}
